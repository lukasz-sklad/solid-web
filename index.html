<body>
  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading" role="status"><img src="loading-logo.svg" alt=""><span class="sr-only">Ładowanie SolidCraft&hellip;</span></div>
  <script>
    function setSolidTheme(targetTheme) {
      const isLight = targetTheme === "light";
      try {
        if (window.solidcraft && typeof window.solidcraft.request === "function") {
          window.solidcraft.request("ui.prefs", { theme: isLight ? "light" : "dark" }).catch(() => {});
        } else {
          window.__pending_theme = targetTheme;
        }
      } catch (err) {
        console.warn("[SolidCraft] Theme error:", err);
      }
    }

    window.addEventListener("message", (event) => {
      if (!event.data) return;
      const theme = event.data.theme || (event.data.type === "set_theme" ? (event.data.theme || event.data.value) : null);
      if (theme === "light" || theme === "dark") {
        setSolidTheme(theme);
        const isLight = theme === "light";
        try {
          document.documentElement.style.colorScheme = isLight ? "light" : "dark";
          document.body.style.background = isLight ? "#e8ebf0" : "#1a1b1e";
          const loading = document.getElementById("solidcraft_loading");
          if (loading) {
            loading.style.background = isLight ? "#e8ebf0" : "#1a1b1e";
            loading.style.color = isLight ? "#4a5060" : "#a0aec0";
          }
        } catch (_) {}
      }
      if (event.data.type === "spin" || event.data.spin !== undefined || event.data.orbit === "continuous") {
        const spin = event.data.spin !== undefined ? !!event.data.spin : true;
        try {
          if (window.solidcraft && typeof window.solidcraft.request === "function") {
            window.solidcraft.request("ui.camera", { spin }).catch(() => {});
          }
        } catch (_) {}
      }
      if (event.data.type === "fit" || event.data.view === "fit") {
        try {
          if (window.solidcraft && typeof window.solidcraft.request === "function") {
            window.solidcraft.request("ui.view", { view: "fit" }).catch(() => {});
          }
        } catch (_) {}
      }
    });

    if (new URLSearchParams(window.location.search).get("theme") === "light") {
      try {
        document.documentElement.style.colorScheme = "light";
        document.body.style.background = "#e8ebf0";
        const loading = document.getElementById("solidcraft_loading");
        if (loading) {
          loading.style.background = "#e8ebf0";
          loading.style.color = "#4a5060";
        }
      } catch (_) {}
    } else {
      try {
        document.documentElement.style.colorScheme = "dark";
        document.body.style.background = "#1a1b1e";
        const loading = document.getElementById("solidcraft_loading");
        if (loading) {
          loading.style.background = "#1a1b1e";
          loading.style.color = "#a0aec0";
        }
      } catch (_) {}
    }

    // Offline use and updates (sw.js; written into release builds by `cargo xtask web-offline`).
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // Install as an app: the browser's offer can come before the app runs, so it is kept here for
    // the app's File ▸ Install app… item (src/install.rs). Installed, the browser makes no more offers.
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.solidcraftInstall = e; });
    addEventListener("appinstalled", () => { window.solidcraftInstall = null; });
  </script>
</body>
